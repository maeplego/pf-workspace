services:
  workspace-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
      POSTGRES_DB: workspace
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - workspace-pg:/var/lib/postgresql/data

  workspace-api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      WORKSPACE_HTTP_PORT: "8096"
      WORKSPACE_DEV_AUTH: ${WORKSPACE_DEV_AUTH:-true}
      WORKSPACE_DATABASE_URL: ${WORKSPACE_DATABASE_URL:-postgres://workspace:workspace@workspace-db:5432/workspace?sslmode=disable}
      WORKSPACE_CORS_ORIGIN: ${WORKSPACE_CORS_ORIGIN:-http://localhost:3006}
      WORKSPACE_INTERNAL_TOKEN: ${WORKSPACE_INTERNAL_TOKEN:-dev-collab-internal}
      WORKSPACE_PUBLIC_URL: ${WORKSPACE_PUBLIC_URL:-http://localhost:8096}
      MEDIA_API_URL: ${MEDIA_API_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_BASE: ${OIDC_INTERNAL_BASE:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    ports:
      - "8096:8096"
    depends_on:
      workspace-db:
        condition: service_healthy

  workspace-collab:
    build:
      context: ../apps/collab
      dockerfile: Dockerfile
    environment:
      COLLAB_PORT: "8097"
      COLLAB_API_URL: ${COLLAB_API_URL:-http://workspace-api:8096}
      COLLAB_INTERNAL_TOKEN: ${WORKSPACE_INTERNAL_TOKEN:-dev-collab-internal}
    ports:
      - "8097:8097"
    depends_on:
      - workspace-api

  workspace-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_COLLAB_WS_URL: ${NEXT_PUBLIC_COLLAB_WS_URL:-ws://localhost:8097}
        NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:-ws://localhost:8096/chat/ws}
    environment:
      WORKSPACE_API_URL: ${WORKSPACE_API_URL:-http://workspace-api:8096}
      NEXT_PUBLIC_COLLAB_WS_URL: ${NEXT_PUBLIC_COLLAB_WS_URL:-ws://localhost:8097}
      NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:-ws://localhost:8096/chat/ws}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_BASE: ${OIDC_INTERNAL_BASE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "3006:3006"
    depends_on:
      - workspace-api
      - workspace-collab

volumes:
  workspace-pg:
